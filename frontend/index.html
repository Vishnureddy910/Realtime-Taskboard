<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time TaskBoard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Viewers get a read-only board: every editing control is tagged .editor-only */
        #board-screen.read-only .editor-only { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between">
        <h1 class="text-xl font-bold">Collaborative TaskBoard</h1>
        <div id="user-info" class="hidden">
            <span id="username-display" class="mr-4"></span>
            <button onclick="promptLogout()" class="bg-blue-800 px-3 py-1 rounded text-sm hover:bg-blue-900">Logout</button>
        </div>
    </nav>

    <!-- Auth Screen -->
    <div id="auth-screen" class="flex-grow flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 relative">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center">Login</h2>
            
            <!-- Email field (only visible during signup) -->
            <input type="email" id="email" placeholder="Email" class="w-full mb-4 p-2 border rounded hidden">
            
            <input type="text" id="username" placeholder="Username" class="w-full mb-4 p-2 border rounded">
            
            <!-- Password field with Eye Icon -->
            <div class="relative w-full mb-6">
                <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded pr-10" onkeypress="if(event.key === 'Enter') isLoginMode ? login() : signup()">
                <button onclick="togglePassword()" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
            
            <button id="auth-btn" onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Sign In</button>
            <p id="auth-error" class="text-red-500 text-sm mt-3 hidden"></p>
            
            <!-- Toggle between Login and Signup -->
            <div class="mt-4 text-center text-sm">
                <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-blue-600 hover:underline">Need an account? Sign up</button>
            </div>
        </div>
    </div>

    <!-- Board Screen (Hidden by default) -->
    <div id="board-screen" class="hidden flex-grow p-6 flex flex-col overflow-hidden">
        
        <!-- Dynamic Board Selector (Removed max-w-6xl) -->
        <div class="mb-6 p-4 bg-white rounded-lg shadow-sm flex items-center w-full gap-4">
            <label class="font-bold text-gray-700 whitespace-nowrap">Current Board:</label>
            <select id="board-select" onchange="switchBoard(this.value)" class="p-2 border rounded flex-grow bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Loading boards...</option>
            </select>
            <span id="role-badge" hidden class="text-xs font-bold uppercase px-2 py-1 rounded-full bg-gray-100 text-gray-700 whitespace-nowrap"></span>
            <button id="members-btn" onclick="openMembersModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 font-bold shadow-sm whitespace-nowrap">
                Members
            </button>
            <!-- Owner only -->
            <button id="invite-btn" onclick="openMembersModal({ mode: 'invite' })" hidden class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 font-bold shadow-sm whitespace-nowrap">
                + Invite
            </button>
            <button onclick="createBoard()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 font-bold shadow-sm whitespace-nowrap">
                + New Board
            </button>
        </div>

        <!-- NEW: Dynamic Columns Container (Removed max-w-6xl, added full width) -->
        <div id="board-columns" class="flex gap-6 overflow-x-auto pb-4 items-start w-full h-full">
            <!-- JavaScript will inject columns here -->
        </div>

    </div>

    <!-- Link to our JavaScript logic -->
    <script src="/static/app.js"></script>

    <!-- Task Modal (Hidden by default) -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96 max-w-full">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Add Task</h2>
            
            <!-- Hidden inputs to track what we are editing -->
            <input type="hidden" id="modal-task-id">
            <input type="hidden" id="modal-list-id">
            <input type="hidden" id="modal-task-version">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Title</label>
                <input type="text" id="modal-task-title" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Fix database schema">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
                <textarea id="modal-task-desc" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-24" placeholder="Enter task details here..."></textarea>
            </div>
            
            <div class="flex justify-end gap-3">
                <button onclick="closeTaskModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 font-semibold">Cancel</button>
                <button onclick="saveTask()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold shadow-sm">Save Task</button>
            </div>
        </div>
    </div>

    <!-- Login Toast Notification (Now Centered) -->
    <div id="toast" class="hidden fixed top-10 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded shadow-lg font-bold z-50 transition-opacity duration-300">
        Login Successful! 🎉
    </div>

    <!-- Generic Delete Confirmation Modal -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96 max-w-full text-center">
            <h2 id="delete-modal-title" class="text-xl font-bold mb-4 text-red-600">Confirm Delete</h2>
            <p id="delete-modal-text" class="mb-6 text-gray-600">Are you sure?</p>
            <div class="flex justify-center gap-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 font-semibold">Cancel</button>
                <button onclick="confirmDelete()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-semibold shadow-sm">Delete</button>
            </div>
        </div>
    </div>

    <!-- Add Column Modal -->
    <div id="list-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96 max-w-full">
            <h2 class="text-xl font-bold mb-4">Add New Column</h2>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Column Name</label>
                <input type="text" id="modal-list-name" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., QA Review">
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="closeListModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 font-semibold">Cancel</button>
                <button onclick="saveList()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold shadow-sm">Add Column</button>
            </div>
        </div>
    </div>

    <!-- Members Modal: one dialog, two modes. "Members" lists and manages people; "+ Invite" (owner only) adds them. -->
    <div id="members-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-[30rem] max-w-full">
            <div class="flex justify-between items-baseline mb-3">
                <h2 id="members-title" class="text-xl font-bold">Board members</h2>
                <span id="members-count" class="text-sm text-gray-500"></span>
            </div>

            <!-- Manage mode -->
            <div id="members-panel">
                <ul id="members-list" class="text-sm divide-y max-h-56 overflow-y-auto"></ul>
                <p id="members-error" class="text-xs text-red-600 mt-1 min-h-[1rem]"></p>
            </div>

            <!-- Invite mode (board owner only) -->
            <div id="invite-section" hidden>
                <label for="invite-search" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <input type="text" id="invite-search" autocomplete="off" placeholder="Start typing a username..."
                            role="combobox" aria-autocomplete="list" aria-controls="invite-suggestions" aria-expanded="false"
                            oninput="onInviteInput()" onkeydown="onInviteKeydown(event)" onblur="hideSuggestions()"
                            class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <ul id="invite-suggestions" role="listbox"
                            class="hidden absolute z-10 w-full bg-white border rounded mt-1 shadow-lg max-h-56 overflow-y-auto"></ul>
                    </div>
                    <select id="invite-role" aria-label="Role" class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="editor">Editor</option>
                        <option value="viewer">Viewer</option>
                    </select>
                    <button id="invite-submit" onclick="submitInvite()" disabled class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">Invite</button>
                </div>
                <p id="invite-hint" class="text-xs text-gray-500 mt-1 min-h-[1rem]"></p>
                <p class="text-xs text-gray-400 mt-1">Editors can add, edit and move tasks. Viewers can only look.</p>
            </div>

            <div class="flex items-center mt-6">
                <button id="leave-board-btn" onclick="leaveBoard()" hidden class="px-3 py-2 text-red-600 hover:bg-red-50 rounded font-semibold">Leave board</button>
                <button onclick="closeMembersModal()" class="ml-auto px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 font-semibold">Close</button>
            </div>
        </div>
    </div>

    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96 max-w-full text-center">
            <h2 class="text-xl font-bold mb-4 text-red-600">Confirm Logout</h2>
            <p class="mb-6 text-gray-600">Are you sure you want to log out of your session?</p>
            <div class="flex justify-center gap-4">
                <button onclick="closeLogoutModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 font-semibold">Cancel</button>
                <button onclick="confirmLogout()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-semibold shadow-sm">Logout</button>
            </div>
        </div>
    </div>
</body>
</html>
